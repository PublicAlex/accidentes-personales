name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verificar:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: accidentes
          POSTGRES_PASSWORD: clave-ci-ficticia
          POSTGRES_DB: accidentes
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U accidentes -d accidentes"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://accidentes:clave-ci-ficticia@localhost:5432/accidentes
      TEST_DATABASE_URL: postgres://accidentes:clave-ci-ficticia@localhost:5432/accidentes_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Crear BD de pruebas
        run: PGPASSWORD=clave-ci-ficticia psql -h localhost -U accidentes -d accidentes -c "CREATE DATABASE accidentes_test;"
      - run: npm ci
      - run: npm run lint:arch
      - run: npm run build
      - run: npm test
